name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    name: Build + publish wheel + sdist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/audit-stream
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a commit on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag must point to a commit reachable from origin/main" >&2
            exit 1
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ".[dev]"
      - name: Validate release version
        run: |
          python - <<'PY'
          import os
          import tomllib

          from audit_stream import __version__

          with open("pyproject.toml", "rb") as metadata:
              package_version = tomllib.load(metadata)["project"]["version"]
          expected_tag = f"v{package_version}"
          if os.environ["GITHUB_REF_NAME"] != expected_tag or __version__ != package_version:
              raise SystemExit(
                  f"release version mismatch: tag={os.environ['GITHUB_REF_NAME']}, "
                  f"package={package_version}, module={__version__}"
              )
          PY
      - name: Check and test release commit
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
          mypy src
          pytest -q
      - name: Build distributions
        run: python -m build
      - name: Inspect distributions
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
