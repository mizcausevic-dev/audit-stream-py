name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: Verify tagged source (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and pinned verification tools
        run: |
          python -m pip install -e .
          python -m pip install "ruff==0.16.10" "mypy==2.4.0" "pytest==9.1.1" "pytest-asyncio==1.4.0" "httpx==0.28.1"
      - name: Verify source
        run: |
          ruff check src tests examples scripts
          ruff format --check src tests examples scripts
          mypy src
          pytest -q

  build:
    name: Build and verify wheel + sdist
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify tag, version, and main ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          source = Path("src/audit_stream/__init__.py").read_text(encoding="utf-8")
          if os.environ["GITHUB_REF_NAME"] != f"v{version}" or f'__version__ = "{version}"' not in source:
              raise SystemExit("tag, project version, and module version do not match")
          PY
      - name: Install pinned build tools
        run: python -m pip install "build==1.6.1" "twine==7.0.0"
      - name: Build distributions
        run: python -m build
      - name: Verify distribution metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py
      - name: Install and import wheel outside the source tree
        run: |
          python -m pip install --only-binary=:all: --target "$RUNNER_TEMP/audit-wheel" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$RUNNER_TEMP/audit-wheel" python - <<'PY'
          import importlib.metadata as metadata
          import os
          from pathlib import Path

          import audit_stream
          from audit_stream.app import app

          target = Path(os.environ["RUNNER_TEMP"], "audit-wheel").resolve()
          assert Path(audit_stream.__file__).resolve().is_relative_to(target)
          assert metadata.version("audit-stream") == os.environ["GITHUB_REF_NAME"][1:]
          assert audit_stream.__version__ == metadata.version("audit-stream")
          assert app.version == audit_stream.__version__
          PY
      - name: Save verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/audit-stream
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
